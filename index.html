<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Магазин</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- <link rel="stylesheet" href="public/css/bootstrap.min.css"> -->

    <style>
      /* Простая анимация кнопки */
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="container my-5">
      <h2 class="mb-4 text-center">Свяжитесь с нами</h2>
      <form
  id="contact-form"
  class="mx-auto"
  style="max-width: 500px"
  action="https://formsubmit.co/fcae7759c86b6ab3554763f3901bed 1f"
  method="POST"
>
  <input type="text" name="_honey" style="display: none" />
  <input type="hidden" name="_subject" value="Новое сообщение с сайта" />
  <input type="hidden" name="_template" value="box" />

  <div class="mb-3">
    <label for="name" class="form-label">Имя</label>
    <input
      type="text"
      class="form-control"
      id="name"
      name="name"
      placeholder="Ваше имя"
      required
    />
  </div>

  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input
      type="email"
      class="form-control"
      id="email"
      name="email"
      placeholder="Ваш email"
      required
    />
  </div>

  <!-- 🔹 Новое поле телефона -->
  <div class="mb-3">
    <label for="phone" class="form-label">Телефон (необязательно)</label>
    <input
      type="tel"
      class="form-control"
      id="phone"
      name="phone"
      
    />
  </div>

  <div class="mb-3">
    <label for="message" class="form-label">Сообщение</label>
    <textarea
      class="form-control"
      id="message"
      name="message"
      rows="5"
      placeholder="Ваше сообщение"
      required
    ></textarea>
  </div>

  <button type="submit" class="btn btn-primary w-100" id="submit-btn">
    Отправить
  </button>
  <div class="mt-3" id="status"></div>
</form>

    </div>

    <div class="container py-3">
      <div class="row mb-3 align-items-center">
        <div class="col-12">
          <label for="priceRange" class="form-label"
            >Цена: <span id="priceLabel">0 - 950 грн</span></label
          >
          <div class="d-flex align-items-center gap-2 text-bg-success">
            <input
              type="range"
              class="form-range flex-grow-1"
              id="minPrice"
              min="0"
              max="10000"
              step="10"
              value="0"
            />
            <input
              type="range"
              class="form-range flex-grow-1"
              id="maxPrice"
              min="0"
              max="10000"
              step="10"
              value="10000"
            />
          </div>
        </div>
      </div>
    </div>

    <select id="sortPrice" class="form-select mb-3 w-50 m-auto">
      <option value="default">Без сортировки</option>
      <option value="asc">Сначала дешёвые</option>
      <option value="desc">Сначала дорогие</option>
    </select>

    <!-- Фильтр по категориям -->
    <div class="container py-3">
      <div class="row mb-3 align-items-center">
        <div class="col-12">
          <label for="categoryFilter" class="form-label">Категория:</label>
          <select id="categoryFilter" class="form-select w-50 m-auto">
            <option value="">Все категории</option>
            <!-- JS динамически добавит остальные категории -->
          </select>
        </div>
      </div>
    </div>

    <div class="container py-3" id="products-list">
      <div class="row list" id="products"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/list.js/2.3.1/list.min.js"></script>
    <!-- <script src="public/js/bootstrap.bundle.min.js"></script> -->

    <script src="public/js/form.js"></script>

    <script type="module" src="public/js/script.js"></script>
  </body>
</html>
